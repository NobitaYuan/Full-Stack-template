services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: server_template
      POSTGRES_USER: template_dev
      POSTGRES_PASSWORD: template_dev_password
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-54320}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, "127.0.0.1", -U, template_dev, -d, server_template]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
